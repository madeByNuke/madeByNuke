<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBD - Made By Nuke</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter and Playfair Display (Italic) for exact styling match -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       BACKGROUND IMAGE CONFIGURATION
       To change the background image, swap the URL below with 
       your uploaded image path (e.g. 'bg-image.jpg' or URL)
       ========================================================= */
    :root {
      --bg-image-url: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop');
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b131e;
      background-image: linear-gradient(to bottom, rgba(11, 19, 30, 0.45), rgba(11, 19, 30, 0.75)), var(--bg-image-url);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Font styling to replicate the reference image */
    .serif-italic {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
    }

    /* Golden amber button styling matching reference image */
    .btn-amber {
      background-color: #f1a93b;
      color: #121212;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(241, 169, 59, 0.25);
    }

    .btn-amber:hover {
      background-color: #f5b651;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(241, 169, 59, 0.4);
    }

    .btn-amber:active {
      transform: translateY(0);
    }

    /* Smooth Fade Transitions */
    .fade-layer {
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fade-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(10px);
      position: absolute;
      visibility: hidden;
    }

    .fade-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      position: relative;
      visibility: visible;
    }

    /* Social Icon Hover Effects */
    .social-icon {
      color: #94a3b8;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .social-icon:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="flex flex-col justify-between min-h-screen px-6 py-8 md:px-12 md:py-10">

  <!-- TOP HEADER (Logo only, no navigation bar or top right buttons) -->
  <header class="w-full flex items-center justify-between z-10">
    <div class="text-xl md:text-2xl font-bold tracking-widest text-white select-none">
      MBD
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 flex flex-col items-center justify-center my-auto py-8 w-full max-w-4xl mx-auto text-center z-10">
    
    <!-- INITIAL HERO TEXT & ADMIT BUTTON LAYER -->
    <div id="hero-content" class="fade-layer fade-visible flex flex-col items-center max-w-2xl">
      <h1 class="text-4xl sm:text-5xl md:text-6xl tracking-tight leading-tight md:leading-tight mb-4 font-normal text-slate-100">
        First, admit that <span class="serif-italic text-white">I'm cool</span> to access the website
      </h1>
      
      <p class="text-slate-300 text-sm sm:text-base font-normal max-w-lg mb-8 opacity-90 leading-relaxed">
        A creative collection of projects, games, and tools built by Nuke.
      </p>

      <button id="admit-btn" onclick="revealVideo()" class="btn-amber px-8 py-3.5 rounded-full text-sm sm:text-base tracking-wide cursor-pointer font-medium">
        I admit that you're cool
      </button>
    </div>

    <!-- YOUTUBE VIDEO LAYER (Hidden initially, reveals when button is clicked) -->
    <!-- Positioned lower in the page directly above the social media icons -->
    <div id="video-content" class="fade-layer fade-hidden w-full max-w-2xl mt-auto pt-6">
      <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-black/60 backdrop-blur-md">
        
        <!-- =========================================================
             YOUTUBE VIDEO EMBED URL
             Replace "dQw4w9WgXcQ" in the src link below with your 
             desired YouTube Video ID!
             ========================================================= -->
        <iframe 
          id="yt-player"
          class="w-full h-full rounded-2xl" 
          src="" 
          title="YouTube video player" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>

      <!-- Optional option to return back to hero text -->
      <button onclick="hideVideo()" class="mt-4 text-xs tracking-wider uppercase text-slate-400 hover:text-white transition-colors cursor-pointer inline-flex items-center gap-1">
        ‹ Go Back
      </button>
    </div>

  </main>

  <!-- FOOTER SOCIAL MEDIA ICONS (White-gray SVGs) -->

    <div class="flex items-center justify-center gap-6 sm:gap-8">

      <!-- Twitter / X -->
      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Twitter">

      </a>

      <!-- TikTok -->

      <!-- Reddit -->
      <a href="https://reddit.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Reddit">

        </svg>
      </a>

      <!-- Facebook -->
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Facebook">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

      </a>

    </div>
  </footer>

  <!-- INTERACTIVITY JAVASCRIPT -->
  <script>
    // ID of the YouTube video to load when button is clicked
    const YOUTUBE_VIDEO_ID = "dQw4w9WgXcQ"; // Change this to your YouTube Video ID

    const heroContent = document.getElementById('hero-content');
    const videoContent = document.getElementById('video-content');
    const ytPlayer = document.getElementById('yt-player');

    function revealVideo() {
      // Fade out main hero content
      heroContent.classList.remove('fade-visible');
      heroContent.classList.add('fade-hidden');

      // Load YouTube Embed src when clicked (enables autoplay)
      ytPlayer.src = `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=1&rel=0`;

      // Wait brief moment before fading in video for smooth feel
      setTimeout(() => {
        videoContent.classList.remove('fade-hidden');
        videoContent.classList.add('fade-visible');
      }, 300);
    }

    function hideVideo() {
      // Fade out video content
      videoContent.classList.remove('fade-visible');
      videoContent.classList.add('fade-hidden');

      // Stop video playback by clearing src
      ytPlayer.src = "";

      // Fade hero content back in
      setTimeout(() => {
        heroContent.classList.remove('fade-hidden');
        heroContent.classList.add('fade-visible');
      }, 300);
    }
  </script>
</body>
</html>
